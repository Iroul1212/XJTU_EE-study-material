name: 💡 需求建议
description: 提出功能建议、资料需求或改进意见
title: "[需求建议] "
labels: ["需求建议"]
body:
  - type: markdown
    attributes:
      value: |
        > 💡 有好的想法？欢迎提出！

  - type: dropdown
    id: suggestion_type
    attributes:
      label: 建议类型
      options:
        - 资料需求（求某门课的资料）
        - 网站功能改进
        - 分类/目录结构调整
        - 其他

  - type: textarea
    id: suggestion
    attributes:
      label: 详细描述
      description: 请详细说明你的需求或建议
      placeholder: "希望能补充 XXX 课程的 XXX 资料..."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 理由（选填）
      description: 为什么这个建议有价值？
