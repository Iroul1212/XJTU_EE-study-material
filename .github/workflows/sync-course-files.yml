name: sync-course-files
on:
  push:
    paths:
      - 'docs/file-queue/**.md'
      - 'docs/assets/uploads/**'
jobs:
  sync-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: archive files to course folders
        run: |
          HAS_CHANGES=false
          for entry in docs/file-queue/*.md; do
            [ -f "$entry" ] || continue
            echo "Processing: $entry"
            COURSE=$(sed -n '/^course:/s/^course:[[:space:]]*//p' "$entry" | tr -d '"' | tr -d "'")
            FILEPATH=$(sed -n '/^file:/s/^file:[[:space:]]*//p' "$entry" | tr -d '"' | tr -d "'")
            if [ -z "$COURSE" ] || [ -z "$FILEPATH" ]; then
              echo "  Skip: missing course or file"
              git rm -f "$entry" 2>/dev/null || true
              HAS_CHANGES=true
              continue
            fi
            # Strip public_folder prefix (/assets/uploads/) to get just the filename
            FILENAME=$(basename "$FILEPATH")
            SOURCE="docs/assets/uploads/$FILENAME"
            TARGET_DIR="$COURSE"
            TARGET="$TARGET_DIR/$FILENAME"
            echo "  Course: $COURSE, File: $FILENAME"
            if [ -f "$SOURCE" ]; then
              echo "  Archive: $SOURCE -> $TARGET"
              mkdir -p "$TARGET_DIR"
              cp "$SOURCE" "$TARGET"
              git add "$TARGET"
              rm "$SOURCE"
              git rm -f "$SOURCE" 2>/dev/null || true
              HAS_CHANGES=true
            else
              echo "  WARNING: source not found: $SOURCE"
              ls -la docs/assets/uploads/ 2>/dev/null || echo "  (uploads dir empty)"
            fi
            git rm -f "$entry" 2>/dev/null || true
          done
          if [ "$HAS_CHANGES" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "auto: archive course files to folders"
            git push
          else
            echo "No files to archive"
          fi

