name: 同步课程文件到根目录文件夹

on:
  push:
    paths:
      - 'docs/file-queue/**.md'
      - 'docs/assets/uploads/**'

jobs:
  sync-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 解析上传队列并归档文件
        run: |
          HAS_CHANGES=false

          # 处理 docs/file-queue/ 下的每个上传条目
          for entry in docs/file-queue/*.md; do
            [ -f "$entry" ] || continue

            echo "处理: $entry"

            # 解析 frontmatter 提取 course 和 file 字段
            COURSE=$(sed -n '/^course:/s/^course:[[:space:]]*//p' "$entry" | tr -d '"' | tr -d "'")
            FILENAME=$(sed -n '/^file:/s/^file:[[:space:]]*//p' "$entry" | tr -d '"' | tr -d "'")

            if [ -z "$COURSE" ] || [ -z "$FILENAME" ]; then
              echo "  跳过: 缺少 course 或 file 字段"
              continue
            fi

            SOURCE="docs/assets/uploads/$FILENAME"
            TARGET_DIR="$COURSE"
            TARGET="$TARGET_DIR/$FILENAME"

            if [ -f "$SOURCE" ]; then
              echo "  归档: $SOURCE → $TARGET"
              mkdir -p "$TARGET_DIR"
              cp "$SOURCE" "$TARGET"
              git add "$TARGET"
              # 删除源文件，避免重复处理
              rm "$SOURCE"
              git rm -f "$SOURCE" 2>/dev/null || true
              HAS_CHANGES=true
            else
              echo "  警告: 源文件不存在 $SOURCE"
            fi
          done

          if [ "$HAS_CHANGES" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "auto: 归档课程文件到对应文件夹"
            git push
          else
            echo "没有需要归档的文件"
          fi
