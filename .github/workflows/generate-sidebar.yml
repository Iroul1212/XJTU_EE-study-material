name: 自动生成侧边栏

on:
  push:
    branches: [main]
    paths:
      - 'docs/courses/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 _sidebar.md
        working-directory: docs
        run: node scripts/generate-sidebar.js

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_sidebar.md
          git diff --staged --quiet || git commit -m "🔄 自动更新侧边栏"
          git push
