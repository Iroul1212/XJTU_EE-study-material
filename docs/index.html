<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d5b54">
  <title>南洋学辅 | XJTU 学习资料站</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --ink:#16302d; --muted:#62736f; --line:#dce7e3; --paper:#f7faf8; --panel:#fff; --brand:#0d6b61; --brand-deep:#084940; --warm:#ef9b49; --sidebar:272px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif; }
    .sidebar { width:var(--sidebar); padding:0 0 32px; background:#fbfcfb; border-right:1px solid var(--line); box-shadow:none; }
    .app-name { margin:0; padding:24px 24px 18px; border-bottom:1px solid var(--line); }
    .app-name-link { color:var(--ink)!important; font-size:19px!important; font-weight:800!important; letter-spacing:0!important; }
    .app-name-link img { width:32px; height:32px; margin-right:10px; vertical-align:middle; border-radius:4px; }
    .sidebar-nav { padding:16px 14px; }
    .sidebar-nav li { margin:2px 0; }
    .sidebar-nav p, .sidebar-nav li>a { color:#5c6d68; font-size:14px; line-height:1.55; }
    .sidebar-nav li>a { border-radius:5px; padding:6px 10px; }
    .sidebar-nav li>a:hover, .sidebar-nav li.active>a { background:#e2f0eb; color:var(--brand-deep)!important; border-right:0; }
    .sidebar-nav strong { color:var(--ink); font-size:13px; letter-spacing:0; }
    .content { left:var(--sidebar); background:var(--paper); }
    .markdown-section { max-width:1180px; padding:40px 48px 72px; }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 { color:var(--ink); font-weight:800; letter-spacing:0; }
    .markdown-section h1 { font-size:32px; margin:0 0 12px; }
    .markdown-section h2 { font-size:21px; margin:46px 0 16px; border:0; }
    .markdown-section h3 { font-size:16px; }
    .markdown-section a { color:var(--brand); font-weight:600; }
    .markdown-section blockquote { margin:18px 0 26px; padding:14px 18px; border-left:3px solid var(--warm); background:#fff9f2; color:#6c4c2c; border-radius:0 5px 5px 0; }
    .markdown-section table { display:table; width:100%; border-collapse:separate; border-spacing:0; background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
    .markdown-section th { background:#eff6f2; color:var(--brand-deep); font-size:13px; }
    .markdown-section td, .markdown-section th { padding:12px 14px; border-color:var(--line); }
    .docsify-copy-code-button, .github-corner { display:none!important; }
    .app-nav { right:24px; top:22px; }
    .app-nav a { color:var(--muted); font-size:13px; }
    .site-search { position:fixed; z-index:20; top:17px; left:calc(var(--sidebar) + 32px); width:min(440px,calc(100vw - var(--sidebar) - 180px)); }
    .site-search input { width:100%; height:38px; padding:0 42px 0 14px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink); outline:none; font:14px inherit; transition:border .18s,box-shadow .18s; }
    .site-search input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(13,107,97,.12); }
    .site-search::after { content:"/"; position:absolute; right:12px; top:9px; color:#91a19d; font:15px ui-monospace,monospace; }
    .search-results { display:none; max-height:390px; margin-top:8px; overflow:auto; border:1px solid var(--line); border-radius:6px; background:#fff; box-shadow:0 14px 35px rgba(23,48,43,.14); }
    .search-results.show { display:block; }
    .search-result { display:block; padding:12px 14px; border-bottom:1px solid #edf2ef; color:var(--ink)!important; text-decoration:none; }
    .search-result:last-child { border:0; }
    .search-result:hover { background:#eef7f3; }
    .search-result b { display:block; font-size:14px; }
    .search-result span { display:block; margin-top:2px; color:var(--muted); font-size:12px; font-weight:400; }
    .home-hero { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:24px; padding:30px; background:var(--brand-deep); color:#fff; border-radius:6px; overflow:hidden; }
    .home-hero h1 { color:#fff; font-size:36px; line-height:1.2; margin:0 0 12px; }
    .home-hero p { max-width:600px; margin:0; color:#d7ebe4; font-size:16px; line-height:1.8; }
    .hero-stats { display:grid; grid-template-columns:1fr 1fr; align-content:center; gap:12px; }
    .hero-stat { padding:14px; background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.16); border-radius:5px; }
    .hero-stat b { display:block; font-size:27px; line-height:1.1; color:#ffe0a3; }
    .hero-stat span { font-size:12px; color:#d7ebe4; }
    .home-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
    .home-actions a { display:inline-flex; align-items:center; min-height:38px; padding:0 15px; border:1px solid rgba(255,255,255,.42); border-radius:5px; color:#fff!important; text-decoration:none; font-size:14px; }
    .home-actions a:first-child { border-color:#f5b661; background:#f5b661; color:#5b3710!important; }
    .course-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .course-card { display:flex; flex-direction:column; min-height:140px; padding:17px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink)!important; text-decoration:none!important; transition:transform .16s,border-color .16s,box-shadow .16s; }
    .course-card:hover { transform:translateY(-2px); border-color:#84b7aa; box-shadow:0 10px 22px rgba(27,67,58,.08); }
    .course-card .course-type { color:var(--brand); font-size:12px; font-weight:700; }
    .course-card b { margin-top:15px; font-size:17px; }
    .course-card span { margin-top:7px; color:var(--muted); font-size:13px; line-height:1.5; font-weight:400; }
    .course-card .course-arrow { margin-top:auto; padding-top:13px; color:var(--brand); font-size:13px; }
    .notice { display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center; padding:20px 22px; background:#fff; border-top:3px solid var(--warm); border-radius:5px; }
    .notice h3 { margin:0 0 4px; }.notice p { margin:0; color:var(--muted); font-size:14px; }.notice a { white-space:nowrap; }
    .file-list { display:grid; gap:9px; margin-top:18px; }
    .file-card { display:flex; align-items:center; gap:14px; padding:13px 15px; border:1px solid var(--line); border-radius:5px; background:#fff; }
    .file-icon { width:30px; color:var(--brand); font-size:18px; text-align:center; }.file-info { min-width:0; flex:1; }.file-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }.file-meta { margin-top:3px; color:var(--muted); font-size:12px; }.file-download { padding:7px 10px; border:1px solid var(--line); border-radius:4px; color:var(--brand)!important; text-decoration:none; font-size:13px; white-space:nowrap; }.file-download:hover { background:#eef7f3; }.file-section-label { margin:25px 0 9px; color:var(--muted); font-size:13px; font-weight:700; }.folder-card { color:var(--ink)!important; text-decoration:none!important; }.folder-card:hover { border-color:#84b7aa; }.file-enter { color:var(--brand); }.file-breadcrumb { margin:6px 0 18px; color:var(--muted); font-size:13px; }.file-breadcrumb a { font-weight:600; text-decoration:none; }.breadcrumb-sep { margin:0 5px; color:#aebbb7; }
    .dark-toggle { position:fixed; right:22px; bottom:22px; z-index:30; display:grid; place-items:center; width:38px; height:38px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--brand); cursor:pointer; font-size:16px; }
    html.dark { --ink:#e6f0ed; --muted:#aabbb5; --line:#314942; --paper:#14211e; --panel:#1b2b27; --brand:#71c3b1; --brand-deep:#092f2a; --sidebar:272px; }
    html.dark .sidebar { background:#10201c; }.dark .app-name { border-color:var(--line); }.dark .app-name-link,.dark .sidebar-nav strong { color:var(--ink)!important; }.dark .sidebar-nav li>a,.dark .sidebar-nav p { color:#b5c8c1; }.dark .sidebar-nav li>a:hover,.dark .sidebar-nav li.active>a { background:#1d3b34; color:#8dd3c4!important; }.dark .site-search input,.dark .search-results,.dark .file-card,.dark .dark-toggle { background:#1b2b27; color:var(--ink); }.dark .search-result { border-color:#314942; }.dark .search-result:hover { background:#244139; }.dark .markdown-section blockquote { background:#2c2a1d; color:#eddca6; }.dark .markdown-section th { background:#213d35; }.dark .notice { background:#1b2b27; }
    @media (max-width:760px) { :root,html.dark { --sidebar:0px; }.sidebar { transform:translateX(-100%); }.content { left:0; }.markdown-section { padding:76px 18px 52px; }.site-search { top:15px; left:56px; width:calc(100vw - 118px); }.app-nav { display:none; }.home-hero { grid-template-columns:1fr; padding:23px; }.home-hero h1 { font-size:29px; }.hero-stats { grid-template-columns:repeat(4,1fr); }.hero-stat { padding:10px; }.hero-stat b { font-size:20px; }.course-grid { grid-template-columns:1fr 1fr; }.notice { grid-template-columns:1fr; }.sidebar-toggle { background:transparent; }.sidebar-toggle span { background:var(--brand); } }
    @media (max-width:430px) { .course-grid { grid-template-columns:1fr; }.hero-stats { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="site-search"><input id="courseSearch" type="search" placeholder="搜索课程，如：电路、概率论" aria-label="搜索课程"><div class="search-results" id="searchResults"></div></div>
  <button class="dark-toggle" id="darkToggle" aria-label="切换深色模式" title="切换深色模式">◐</button>
  <script>
    (function () {
      var courses = [
        ['思修','公共课程 / 思政类'],['史纲','公共课程 / 思政类'],['毛概','公共课程 / 思政类'],['马原','公共课程 / 思政类'],['习思想','公共课程 / 思政类'],['军理（国防教育）','公共课程 / 思政类'],['高数&CMC','公共课程 / 数学类'],['线代','公共课程 / 数学类'],['概率论','公共课程 / 数学类'],['复变','公共课程 / 数学类'],['数学物理方程','公共课程 / 数学类'],['大学物理','公共课程 / 物理与化学'],['大物实验','公共课程 / 物理与化学'],['大学化学','公共课程 / 物理与化学'],['大化实验','公共课程 / 物理与化学'],['工程制图','公共课程'],['大计基','公共课程'],['南洋独家资料','公共课程'],['电路','电气专业 / 专业核心课'],['电路实验','电气专业 / 实验与实践'],['模拟电子技术','电气专业 / 专业核心课'],['数电','电气专业 / 专业核心课'],['电磁场','电气专业 / 专业核心课'],['信号与系统','电气专业 / 专业核心课'],['模电数电实验','电气专业 / 实验与实践'],['电磁场和信号与系统实验','电气专业 / 实验与实践']
      ];
      function route(name) { return '#/../' + encodeURIComponent(name) + '/'; }
      var input=document.getElementById('courseSearch'), results=document.getElementById('searchResults');
      function renderSearch() { var q=input.value.trim().toLowerCase(); if (!q) { results.classList.remove('show'); results.innerHTML=''; return; } var matches=courses.filter(function(c){return (c[0]+c[1]).toLowerCase().indexOf(q)>-1;}).slice(0,8); results.innerHTML=matches.length?matches.map(function(c){return '<a class="search-result" href="'+route(c[0])+'"><b>'+c[0]+'</b><span>'+c[1]+'</span></a>';}).join(''):'<div class="search-result"><b>未找到相关课程</b><span>试试使用课程全称或简称</span></div>'; results.classList.add('show'); }
      input.addEventListener('input',renderSearch); input.addEventListener('keydown',function(e){if(e.key==='Enter'){var a=results.querySelector('a');if(a)a.click();}}); document.addEventListener('click',function(e){if(!e.target.closest('.site-search'))results.classList.remove('show');}); document.addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement!==input){e.preventDefault();input.focus();}});
      var key='xjtu-ee-theme', toggle=document.getElementById('darkToggle'); function theme(dark){document.documentElement.classList.toggle('dark',dark);localStorage.setItem(key,dark?'dark':'light');} theme(localStorage.getItem(key)==='dark'||(!localStorage.getItem(key)&&matchMedia('(prefers-color-scheme: dark)').matches)); toggle.addEventListener('click',function(){theme(!document.documentElement.classList.contains('dark'));});
      window.$docsify={name:'<img src="logo.png" alt="">南洋学辅',repo:'https://github.com/Iroul1212/XJTU_EE-study-material',loadSidebar:true,alias:{'/.*/_sidebar.md':'/_sidebar.md'},subMaxLevel:2,auto2top:true,plugins:[function(hook){hook.doneEach(function(){redirectAdmin();setTimeout(handleFolder,80);});}]};
      function icon(name, dir) { if(dir)return 'DIR'; var ext=name.split('.').pop().toLowerCase(); return {pdf:'PDF',doc:'DOC',docx:'DOC',ppt:'PPT',pptx:'PPT',zip:'ZIP',rar:'ZIP',jpg:'IMG',png:'IMG',md:'MD',txt:'TXT'}[ext]||'FILE'; }
      function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';}
      function redirectAdmin(){if(/^#\/admin\/?$/.test(location.hash)){location.assign(new URL('admin/',location.href).href);}}
      function handleFolder(){var m=location.hash.match(/^#\/\.\.\/(.+?)\/?$/);if(!m)return;var path=decodeURIComponent(m[1]).replace(/\/$/,'');var main=document.querySelector('.markdown-section');if(!main)return;main.innerHTML='<h1>'+path.split('/').pop()+'</h1><p class="file-breadcrumb"><a href="#/">资料首页</a></p><div class="file-list"><div class="file-card">正在读取资料目录...</div></div>';fetch('https://api.github.com/repos/Iroul1212/XJTU_EE-study-material/contents/'+encodeURI(path)).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(function(items){var crumb=path.split('/').map(function(p,i){var to=path.split('/').slice(0,i+1).join('/');return i===path.split('/').length-1?'<span>'+p+'</span>':'<a href="#/../'+encodeURIComponent(to)+'/">'+p+'</a>';}).join('<span class="breadcrumb-sep">/</span>');var dirs=items.filter(function(i){return i.type==='dir';}), files=items.filter(function(i){return i.type==='file';});function list(arr,title){if(!arr.length)return '';return '<div class="file-section-label">'+title+'</div><div class="file-list">'+arr.map(function(i){var isDir=i.type==='dir',href=isDir?'#/../'+encodeURIComponent(path+'/'+i.name)+'/':i.download_url;return '<a class="file-card '+(isDir?'folder-card':'')+'" href="'+href+'" '+(isDir?'':'target="_blank" rel="noopener"')+'><span class="file-icon">'+icon(i.name,isDir)+'</span><span class="file-info"><span class="file-name">'+i.name+'</span><span class="file-meta">'+(isDir?'文件夹':size(i.size))+'</span></span><span class="file-enter">'+(isDir?'打开':'下载')+'</span></a>';}).join('')+'</div>';};main.innerHTML='<h1>'+path.split('/').pop()+'</h1><p class="file-breadcrumb"><a href="#/">资料首页</a><span class="breadcrumb-sep">/</span>'+crumb+'</p>'+list(dirs,'文件夹')+list(files,'资料文件');}).catch(function(){main.innerHTML='<h1>'+path.split('/').pop()+'</h1><p>目录暂时无法加载。请检查网络连接后重试，或前往 <a href="https://github.com/Iroul1212/XJTU_EE-study-material" target="_blank" rel="noopener">GitHub 仓库</a> 浏览资料。</p>';});}
      addEventListener('hashchange',function(){redirectAdmin();setTimeout(handleFolder,80);});
    }());
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
