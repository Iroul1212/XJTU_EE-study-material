<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>XJTU 南洋学辅学习资料站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <style>
    /* ===== 搜索栏移到顶部居中 ===== */
    body > .search,
    .search {
      position: fixed !important;
      top: 12px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 90 !important;
      width: 400px !important;
      max-width: 55vw !important;
      padding: 0 !important;
      margin: 0 !important;
      border-bottom: none !important;
    }
    body > .search input,
    .search input {
      width: 100% !important;
      border-radius: 24px !important;
      padding: 10px 20px !important;
      font-size: 14px !important;
      border: 1px solid #ddd !important;
      background: #fff !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08) !important;
      transition: box-shadow 0.3s, border-color 0.3s;
      margin: 0 !important;
    }
    body > .search input:focus,
    .search input:focus {
      outline: none !important;
      border-color: #4a8cd9 !important;
      box-shadow: 0 4px 20px rgba(74,140,217,0.2) !important;
    }
    /* 隐藏 docsify 默认搜索结果面板，使用自定义面板 */
    body > .search .results-panel,
    .search .results-panel {
      display: none !important;
    }

    /* ===== 自定义搜索下拉面板 ===== */
    .custom-search-results {
      display: none;
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      width: 440px;
      max-width: 60vw;
      max-height: 420px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      z-index: 95;
    }
    .custom-search-results.show {
      display: block;
    }
    .custom-search-result-item {
      display: flex;
      align-items: center;
      padding: 10px 18px;
      cursor: pointer;
      border-bottom: 1px solid #f2f2f2;
      transition: background 0.15s;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }
    .custom-search-result-item:last-child {
      border-bottom: none;
    }
    .custom-search-result-item:hover,
    .custom-search-result-item.active {
      background: #e6f0fa;
    }
    .custom-search-result-item .result-icon {
      font-size: 18px;
      flex-shrink: 0;
      width: 24px;
      text-align: center;
    }
    .custom-search-result-item .result-info {
      flex: 1;
      min-width: 0;
    }
    .custom-search-result-item .result-name {
      font-weight: 600;
      font-size: 14px;
      color: #333;
    }
    .custom-search-result-item .result-category {
      font-size: 11px;
      color: #999;
      margin-top: 1px;
    }
    .custom-search-no-result {
      padding: 24px 18px;
      text-align: center;
      color: #999;
      font-size: 14px;
    }
    .custom-search-empty-hint {
      padding: 16px 18px;
      text-align: center;
      color: #bbb;
      font-size: 13px;
    }
    /* 暗黑模式 */
    html.dark .custom-search-results {
      background: #2a2a3c;
      border-color: #45475a;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    html.dark .custom-search-result-item {
      border-bottom-color: #3a3a4c;
    }
    html.dark .custom-search-result-item:hover,
    html.dark .custom-search-result-item.active {
      background: #3a3a50;
    }
    html.dark .custom-search-result-item .result-name {
      color: #cdd6f4;
    }
    html.dark .custom-search-result-item .result-category {
      color: #6c7086;
    }
    html.dark .custom-search-no-result {
      color: #6c7086;
    }
    html.dark .custom-search-empty-hint {
      color: #585b70;
    }

    /* 侧边栏搜索栏顶部留空 */
    .sidebar-nav {
      margin-top: 52px;
    }

    /* ===== 侧边栏可折叠子级 ===== */
    .sidebar-nav ul ul { overflow: hidden; transition: max-height 0.3s ease; }
    .sidebar-nav ul ul.collapsed { max-height: 0 !important; }
    /* 可折叠项通用样式 */
    .sidebar-collapse {
      cursor: pointer !important;
      user-select: none;
    }
    .sidebar-collapse::before {
      content: '▼';
      font-size: 10px;
      margin-right: 4px;
      display: inline-block;
      transition: transform 0.2s;
      vertical-align: middle;
      color: #999;
    }
    .sidebar-collapse.collapsed::before {
      transform: rotate(-90deg);
    }
    html.dark .sidebar-collapse::before {
      color: #6c7086;
    }

    /* 移动端 */
    @media (max-width: 768px) {
      .markdown-section { max-width: 100% !important; }
    }

    /* ===== 左上角固定 Logo ===== */
    .site-logo {
      position: fixed;
      top: 12px;
      left: 16px;
      z-index: 100;
      height: 52px;
      width: auto;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
      transition: transform 0.3s;
    }
    .site-logo:hover {
      transform: scale(1.05);
    }
    html.dark .site-logo {
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }

    /* 隐藏侧边栏内的 logo，并美化标题文字 */
    .app-name-link img {
      display: none;
    }
    .app-name-link {
      font-size: 30px !important;
      font-weight: 800 !important;
      letter-spacing: 2px !important;
      color: #2b6cb0 !important;
      background: none !important;
      -webkit-background-clip: unset !important;
      -webkit-text-fill-color: #2b6cb0 !important;
      background-clip: unset !important;
    }
    html.dark .app-name-link {
      color: #5b9bd5 !important;
      background: none !important;
      -webkit-background-clip: unset !important;
      -webkit-text-fill-color: #5b9bd5 !important;
      background-clip: unset !important;
    }
    .app-name {
      margin: 12px 0 4px 0 !important;
    }

    /* ===== 暗黑模式切换按钮 ===== */
    .dark-mode-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.3s;
      line-height: 1;
    }
    .dark-mode-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    /* ===== 暗黑模式全局样式 ===== */
    html.dark {
      /* Docsify 主体 */
      --bg: #1e1e2e;
      --bg-secondary: #2a2a3c;
      --bg-sidebar: #1a1a2e;
      --text: #cdd6f4;
      --text-secondary: #a6adc8;
      --text-muted: #6c7086;
      --border: #45475a;
      --link: #89b4fa;
      --link-hover: #b4d0fb;
      --accent: #4a8cd9;
      --code-bg: #313244;
      --table-stripe: #252536;
    }

    /* --- 左侧 Docsify 侧边栏 --- */
    html.dark .sidebar {
      background: #1a1a2e !important;
      border-right: 1px solid #45475a !important;
    }
    html.dark .sidebar-nav li > a,
    html.dark .sidebar-nav li > p,
    html.dark .sidebar-nav strong {
      color: #cdd6f4 !important;
    }
    html.dark .sidebar-nav li.active > a {
      color: #4a8cd9 !important;
      border-right-color: #4a8cd9 !important;
    }
    html.dark .sidebar-nav li > a:hover {
      color: #89b4fa !important;
    }
    html.dark .app-name-link,
    html.dark .app-name {
      color: #5b9bd5 !important;
    }
    html.dark .search input {
      background: #313244 !important;
      color: #cdd6f4 !important;
      border-color: #45475a !important;
    }
    html.dark .search input:focus {
      border-color: #4a8cd9 !important;
      box-shadow: 0 4px 20px rgba(74,140,217,0.2) !important;
    }
    html.dark .search input::placeholder {
      color: #6c7086 !important;
    }

    /* --- 内容区域 --- */
    html.dark body {
      background: #1e1e2e !important;
    }
    html.dark .content {
      background: #1e1e2e !important;
    }
    html.dark .markdown-section {
      color: #cdd6f4 !important;
    }
    html.dark .markdown-section h1,
    html.dark .markdown-section h2,
    html.dark .markdown-section h3,
    html.dark .markdown-section h4,
    html.dark .markdown-section h5,
    html.dark .markdown-section h6 {
      color: #f0f0f0 !important;
      border-bottom-color: #45475a !important;
    }
    html.dark .markdown-section strong {
      color: #f5c2e7 !important;
    }
    html.dark .markdown-section a {
      color: #89b4fa !important;
    }
    html.dark .markdown-section a:hover {
      color: #b4d0fb !important;
    }

    /* --- 表格 --- */
    html.dark .markdown-section table {
      border-color: #45475a !important;
    }
    html.dark .markdown-section th {
      background: #313244 !important;
      color: #cdd6f4 !important;
      border-color: #45475a !important;
    }
    html.dark .markdown-section td {
      border-color: #45475a !important;
      color: #cdd6f4 !important;
    }
    html.dark .markdown-section tr:nth-child(even) td {
      background: #252536 !important;
    }
    html.dark .markdown-section tr:hover td {
      background: #313244 !important;
    }

    /* --- 代码块 --- */
    html.dark .markdown-section code {
      background: #313244 !important;
      color: #f38ba8 !important;
    }
    html.dark .markdown-section pre {
      background: #313244 !important;
      border-color: #45475a !important;
    }
    html.dark .markdown-section pre code {
      background: transparent !important;
      color: #cdd6f4 !important;
    }

    /* --- 引用块 --- */
    html.dark .markdown-section blockquote {
      background: #252536 !important;
      border-left-color: #4a8cd9 !important;
      color: #a6adc8 !important;
    }

    /* --- 分割线 --- */
    html.dark .markdown-section hr {
      border-color: #45475a !important;
    }

    /* --- 暗黑按钮暗色下样式 --- */
    html.dark .dark-mode-toggle {
      background: #313244;
      border-color: #45475a;
      color: #f9e2af;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* --- Docsify 覆盖导航 --- */
    html.dark .app-nav a {
      color: #a6adc8 !important;
    }
    html.dark .app-nav a:hover {
      color: #89b4fa !important;
    }
    html.dark .app-nav li ul {
      background: #2a2a3c !important;
      border-color: #45475a !important;
    }
    html.dark .app-nav li ul li a {
      color: #cdd6f4 !important;
    }

    /* --- 分页导航 --- */
    html.dark .docsify-pagination-container {
      border-top-color: #45475a !important;
    }
    html.dark .pagination-item-label {
      color: #a6adc8 !important;
    }
    html.dark .pagination-item-title {
      color: #89b4fa !important;
    }

    /* ===== 文件列表卡片样式 ===== */
    .file-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      transition: all 0.2s;
      gap: 12px;
    }
    .file-card:hover {
      border-color: #4a8cd9;
      box-shadow: 0 2px 12px rgba(74,140,217,0.12);
      transform: translateY(-1px);
    }
    .file-card .file-icon {
      font-size: 28px;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
    }
    .file-card .file-info {
      flex: 1;
      min-width: 0;
    }
    .file-card .file-name {
      font-weight: 600;
      font-size: 15px;
      color: #333;
      word-break: break-all;
    }
    .file-card .file-meta {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    .file-card .file-download {
      flex-shrink: 0;
      padding: 7px 18px;
      background: #4a8cd9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .file-card .file-download:hover {
      background: #3a74b8;
      text-decoration: none;
      color: #fff;
    }
    .file-list-empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .file-list-empty .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .file-list-loading {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .file-list-error {
      text-align: center;
      padding: 40px 20px;
      color: #e74c3c;
    }

    /* 暗黑模式文件列表 */
    html.dark .file-card {
      background: #252536;
      border-color: #45475a;
    }
    html.dark .file-card:hover {
      border-color: #4a8cd9;
      box-shadow: 0 2px 12px rgba(74,140,217,0.15);
    }
    html.dark .file-card .file-name { color: #cdd6f4; }
    html.dark .file-card .file-meta { color: #6c7086; }
    html.dark .file-list-empty { color: #6c7086; }
    html.dark .file-list-loading { color: #6c7086; }

    /* ===== 文件夹卡片样式 ===== */
    .folder-card {
      text-decoration: none !important;
      color: inherit !important;
    }
    .folder-card .file-name {
      color: #1d4f7a !important;
      font-weight: 600;
    }
    .folder-card:hover .file-name {
      color: #4a8cd9 !important;
    }
    .file-enter {
      font-size: 14px;
      color: #ccc;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .folder-card:hover .file-enter {
      transform: translateX(4px);
      color: #4a8cd9;
    }
    html.dark .folder-card .file-name {
      color: #7db8e8 !important;
    }
    html.dark .folder-card:hover .file-name {
      color: #4a8cd9 !important;
    }
    html.dark .file-enter {
      color: #585b70;
    }
    html.dark .folder-card:hover .file-enter {
      color: #4a8cd9;
    }

    /* ===== 文件分区标签 ===== */
    .file-section-label {
      font-size: 13px;
      font-weight: 600;
      color: #999;
      padding: 8px 0 4px 0;
      margin-top: 4px;
      letter-spacing: 1px;
    }
    html.dark .file-section-label {
      color: #6c7086;
    }

    /* ===== 面包屑导航 ===== */
    .file-breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      padding: 8px 0 16px 0;
      font-size: 14px;
    }
    .file-breadcrumb a {
      color: #4a8cd9;
      text-decoration: none;
      font-weight: 500;
    }
    .file-breadcrumb a:hover {
      text-decoration: underline;
      color: #1d4f7a;
    }
    .file-breadcrumb .breadcrumb-sep {
      color: #ccc;
      margin: 0 2px;
    }
    .file-breadcrumb .breadcrumb-current {
      color: #666;
      font-weight: 600;
    }
    html.dark .file-breadcrumb a {
      color: #7db8e8;
    }
    html.dark .file-breadcrumb a:hover {
      color: #4a8cd9;
    }
    html.dark .file-breadcrumb .breadcrumb-sep {
      color: #585b70;
    }
    html.dark .file-breadcrumb .breadcrumb-current {
      color: #a6adc8;
    }
  </style>
</head>
<body>
  <!-- 左上角 Logo -->
  <a href="./" title="返回首页"><img class="site-logo" src="logo.png" alt="XJTU 学习资料站"></a>
  <div id="app"></div>
  <!-- 自定义搜索下拉面板 -->
  <div class="custom-search-results" id="customSearchResults"></div>
  <!-- 暗黑模式切换按钮 -->
  <button class="dark-mode-toggle" id="darkModeToggle" title="切换暗黑模式" aria-label="切换暗黑模式">🌙</button>
  <script>
    window.$docsify = {
      name: '南洋学辅',
      repo: 'https://github.com/Iroul1212/XJTU_EE-study-material',
      loadSidebar: true,
      // 自动检测 GitHub Pages 路径前缀
      basePath: (function() {
        if (typeof window !== 'undefined' && window.location.hostname.includes('github.io')) {
          return '/XJTU_EE-study-material/';
        }
        return '/';
      })(),
      // 强制所有路由都加载根目录的 _sidebar.md，
      // 避免进入课程页面（如 #/../思修/）时 Docsify 尝试
      // 加载 /思修/_sidebar.md 导致 Netlify 返回 index.html 而卡在 loading
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
      subMaxLevel: 3,
      auto2top: true,
      // 搜索配置（仅用于输入框样式，实际搜索由自定义逻辑接管）
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 搜索课程（如 高数、电路、模电...）',
        noData: '没有找到相关结果',
        depth: 0,
        hideOtherSidebarContent: false,
      },
      // 页面切换后自动重建 TOC
      plugins: [
        function (hook, vm) {
          // ===== 课程搜索引擎：从 _sidebar.md 动态解析课程索引 =====
          // 别名映射表（新增课程时在此添加别名即可，无需修改索引）
          var COURSE_ALIAS_MAP = {
            '思修': ['思想道德修养', '思想道德'],
            '史纲': ['近代史纲要', '近代史', '中国近现代史'],
            '毛概': ['毛泽东思想', '毛泽东'],
            '马原': ['马克思主义', '马克思', '马哲'],
            '习思想': ['习近平', '新时代', '中特', '习概'],
            '军理（国防教育）': ['国防教育', '军事理论', '军事', '军理'],
            '高数&CMC': ['高等数学', '高数', 'CMC', '数学竞赛'],
            '线代': ['线性代数', '矩阵'],
            '概率论': ['概率统计', '概率', '统计'],
            '复变': ['复变函数', '复数'],
            '数学物理方程': ['数理方程', '偏微分方程', 'PDE'],
            '大学物理': ['大物', '物理', '力学', '电磁学'],
            '大物实验': ['物理实验', '大学物理实验'],
            '大学化学': ['大化', '化学'],
            '大化实验': ['化学实验', '大学化学实验'],
            '工程制图': ['工图', '制图', 'CAD'],
            '大计基': ['大学计算机基础', '计算机基础', '计基', '编程'],
            '南洋独家资料': ['南洋', '独家', '独家资料', '南洋资料', '学辅资料'],
            '电路': ['电路分析', '电路理论', '基尔霍夫'],
            '电路实验': ['电路实验课'],
            '模拟电子技术': ['模电', '模拟电路', '运放', '放大器'],
            '数电': ['数字电子技术', '数字电路', '逻辑电路', 'FPGA'],
            '电磁场': ['电磁场理论', '电磁波', '麦克斯韦'],
            '信号与系统': ['信号', '系统', '傅里叶', '拉普拉斯', '卷积'],
            '模电数电实验': ['模电实验', '数电实验', '电子实验'],
            '电磁场和信号与系统实验': ['电磁实验', '信号实验', '电磁场实验','信号与系统实验'],
          };

          // 从 _sidebar.md 动态解析课程列表
          function parseSidebarForCourses(mdText) {
            var lines = mdText.split('\n');
            var courses = [];
            var catStack = [];

            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];

              // 解析分类标题: - **分类名**
              var boldMatch = line.match(/^\s*\-\s+\*\*(.+?)\*\*\s*$/);
              if (boldMatch) {
                var catName = boldMatch[1].replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27FF]|[\u2300-\u23FF]|[\u2B00-\u2BFF]|\uFE0F/g, '').trim();
                if (!catName) continue;
                var indent = (line.match(/^(\s*)/) || [''])[0].length;
                var level = Math.floor(indent / 4);
                catStack.length = level;
                catStack.push(catName);
                continue;
              }

              // 解析课程链接: - [🎖️ 课程名](../课程路径/)
              var linkMatch = line.match(/^\s*\-\s+\[(.+?)\]\((.+?)\)/);
              if (!linkMatch) continue;

              var fullText = linkMatch[1];
              var path = linkMatch[2];

              // 过滤掉非课程链接（首页、教程、外部链接等）
              if (path === '/' || path === 'admin/' || /\.md$/.test(path) || /^https?:\/\//.test(path)) continue;
              // 跳过占位符
              if (fullText.indexOf('待补充') !== -1) continue;

              // 提取图标（首个 emoji）和名称
              var iconMatch = fullText.match(/^([\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27FF]|[\u2300-\u23FF]|[\u2B00-\u2BFF])(\uFE0F)?\s*/);
              var icon = iconMatch ? (iconMatch[1] + (iconMatch[2] || '')) : '📚';
              var name = iconMatch ? fullText.slice(iconMatch[0].length).trim() : fullText.trim();

              var category = catStack.join(' / ');
              var alias = COURSE_ALIAS_MAP[name] || [];

              courses.push({ name: name, alias: alias, category: category, path: path, icon: icon });
            }
            return courses;
          }

          // 全局课程索引（初始化时从 _sidebar.md 加载）
          var COURSE_INDEX = [];
          var COURSE_INDEX_READY = false;

          function loadCourseIndex(callback) {
            if (COURSE_INDEX_READY && COURSE_INDEX.length > 0) { callback(); return; }
            // 尝试从 sessionStorage 读取缓存
            try {
              var cached = sessionStorage.getItem('xjtu_course_index');
              if (cached) {
                COURSE_INDEX = JSON.parse(cached);
                COURSE_INDEX_READY = true;
                callback();
                return;
              }
            } catch (e) { /* ignore */ }

            // 从当前 origin 获取 _sidebar.md
            var basePath = (window.$docsify && window.$docsify.basePath) || '/';
            var sidebarUrl = basePath.replace(/\/$/, '') + '/_sidebar.md';
            // 处理 GitHub Pages 路径前缀
            if (sidebarUrl === '/_sidebar.md' && window.location.hostname.includes('github.io')) {
              sidebarUrl = '/XJTU_EE-study-material/_sidebar.md';
            }

            fetch(sidebarUrl)
              .then(function (res) { return res.text(); })
              .then(function (md) {
                COURSE_INDEX = parseSidebarForCourses(md);
                COURSE_INDEX_READY = true;
                try { sessionStorage.setItem('xjtu_course_index', JSON.stringify(COURSE_INDEX)); } catch (e) { /* ignore */ }
                callback();
              })
              .catch(function () {
                // 降级：使用空索引，搜索将无结果
                COURSE_INDEX_READY = true;
                callback();
              });
          }

          // 搜索匹配函数：支持拼音首字母、汉字、别名模糊匹配
          function matchCourse(query, course) {
            var q = query.toLowerCase().replace(/\s+/g, '');
            if (!q) return false;
            // 课程名精确/包含匹配
            if (course.name.toLowerCase().indexOf(q) !== -1) return true;
            // 别名匹配
            for (var i = 0; i < course.alias.length; i++) {
              if (course.alias[i].toLowerCase().indexOf(q) !== -1) return true;
            }
            // 模糊逐字匹配：查询词中每个字都在课程名或别名中出现
            var allFields = course.name + ' ' + course.alias.join(' ');
            var matched = true;
            for (var j = 0; j < q.length; j++) {
              if (allFields.indexOf(q.charAt(j)) === -1) { matched = false; break; }
            }
            return matched;
          }

          function initCustomSearch() {
            var searchInput = document.querySelector('.search input');
            var resultsPanel = document.getElementById('customSearchResults');
            if (!searchInput || !resultsPanel) return;

            // 等待课程索引从 _sidebar.md 加载完成后再初始化搜索
            loadCourseIndex(function () {
              // 如果索引仍为空（fetch 失败），显示提示
              if (COURSE_INDEX.length === 0) {
                searchInput.placeholder = '🔍 搜索课程（索引加载中...）';
              }
              initSearchUI();
            });

            function initSearchUI() {
            var activeIndex = -1;
            var currentResults = [];

            function renderResults(results) {
              if (results.length === 0) {
                var query = searchInput.value.trim();
                if (query) {
                  resultsPanel.innerHTML = '<div class="custom-search-no-result">🔍 未找到匹配课程 "<b>' + query + '</b>"<br><span style="font-size:12px;">试试其他关键词，如 高数、模电、电路...</span></div>';
                } else {
                  // 空输入时显示热门课程
                  var hotCourses = COURSE_INDEX.slice(0, 8);
                  var html = '';
                  for (var i = 0; i < hotCourses.length; i++) {
                    var c = hotCourses[i];
                    html += '<a class="custom-search-result-item" href="#/' + c.path + '">';
                    html += '<span class="result-icon">' + c.icon + '</span>';
                    html += '<div class="result-info"><div class="result-name">' + c.name + '</div>';
                    html += '<div class="result-category">' + c.category + '</div></div>';
                    html += '</a>';
                  }
                  html += '<div class="custom-search-empty-hint">💡 输入关键词搜索课程...</div>';
                  resultsPanel.innerHTML = html;
                }
              } else {
                var html = '';
                for (var i = 0; i < results.length; i++) {
                  var c = results[i];
                  html += '<a class="custom-search-result-item' + (i === activeIndex ? ' active' : '') + '" href="#/' + c.path + '" data-index="' + i + '">';
                  html += '<span class="result-icon">' + c.icon + '</span>';
                  html += '<div class="result-info"><div class="result-name">' + c.name + '</div>';
                  html += '<div class="result-category">' + c.category + '</div></div>';
                  html += '</a>';
                }
                resultsPanel.innerHTML = html;
              }
              if (searchInput.value.trim() || currentResults.length > 0) {
                resultsPanel.classList.add('show');
              }
            }

            function doSearch() {
              var query = searchInput.value.trim();
              activeIndex = -1;
              if (!query) {
                currentResults = [];
                renderResults([]);
                return;
              }
              currentResults = [];
              for (var i = 0; i < COURSE_INDEX.length; i++) {
                if (matchCourse(query, COURSE_INDEX[i])) {
                  currentResults.push(COURSE_INDEX[i]);
                }
              }
              renderResults(currentResults);
            }

            // 监听输入
            searchInput.addEventListener('input', doSearch);
            searchInput.addEventListener('focus', function () {
              if (!searchInput.value.trim()) {
                currentResults = [];
                renderResults([]);
              }
              resultsPanel.classList.add('show');
            });

            // 键盘导航
            searchInput.addEventListener('keydown', function (e) {
              var items = resultsPanel.querySelectorAll('.custom-search-result-item');
              if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (activeIndex < items.length - 1) activeIndex++;
                else activeIndex = 0;
                renderResults(currentResults);
              } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (activeIndex > 0) activeIndex--;
                else activeIndex = items.length - 1;
                renderResults(currentResults);
              } else if (e.key === 'Enter') {
                if (activeIndex >= 0 && items[activeIndex]) {
                  e.preventDefault();
                  items[activeIndex].click();
                }
              } else if (e.key === 'Escape') {
                resultsPanel.classList.remove('show');
                searchInput.blur();
              }
            });

            // 点击外部关闭
            document.addEventListener('click', function (e) {
              if (!searchInput.contains(e.target) && !resultsPanel.contains(e.target)) {
                resultsPanel.classList.remove('show');
              }
            });

            // 点击结果项后关闭面板
            resultsPanel.addEventListener('click', function (e) {
              var item = e.target.closest('.custom-search-result-item');
              if (item) {
                setTimeout(function () { resultsPanel.classList.remove('show'); }, 200);
              }
            });
          } // end initSearchUI
          } // end initCustomSearch

          // 侧边栏折叠展开
          function setupCollapsibleSidebar() {
            var sidebarNav = document.querySelector('.sidebar-nav');
            if (!sidebarNav) return;

            function findChildUl(li) {
              for (var i = 0; i < li.children.length; i++) {
                if (li.children[i].tagName === 'UL') return li.children[i];
              }
              return null;
            }

            function bindCollapse(el) {
              if (el.classList.contains('collapse-bound')) return;
              var parentLi = el.parentElement;
              if (!parentLi || parentLi.tagName !== 'LI') return;
              // 查找子 UL：先找同级，再找内部嵌套
              var childUl = findChildUl(parentLi) || el.querySelector('ul');
              if (!childUl) return;

              el.classList.add('collapse-bound', 'sidebar-collapse');
              childUl.style.maxHeight = childUl.scrollHeight + 'px';

              el.addEventListener('click', function (e) {
                e.stopPropagation();
                var ul = findChildUl(parentLi) || el.querySelector('ul');
                if (!ul) return;
                var isCollapsed = ul.classList.contains('collapsed');
                if (isCollapsed) {
                  ul.classList.remove('collapsed');
                  ul.style.maxHeight = ul.scrollHeight + 'px';
                  el.classList.remove('collapsed');
                } else {
                  ul.style.maxHeight = ul.scrollHeight + 'px';
                  ul.offsetHeight;
                  ul.classList.add('collapsed');
                  ul.style.maxHeight = '0px';
                  el.classList.add('collapsed');
                }
              });
            }

            // 绑定所有 li > p 和 li > strong
            sidebarNav.querySelectorAll('li > p').forEach(function (p) { bindCollapse(p); });
            sidebarNav.querySelectorAll('li > strong').forEach(function (s) { bindCollapse(s); });
          }

          // 搜索栏移到 body 顶部居中（JS 兜底）
          hook.mounted(function () {
            var el = document.querySelector('.search');
            if (el) {
              el.style.position = 'fixed';
              el.style.top = '12px';
              el.style.left = '50%';
              el.style.transform = 'translateX(-50%)';
              el.style.zIndex = '90';
              el.style.width = '400px';
              el.style.maxWidth = '55vw';
              el.style.padding = '0';
              el.style.margin = '0';
              el.style.borderBottom = 'none';
              document.body.appendChild(el);
            }
            setupCollapsibleSidebar();

            // ===== 自定义课程搜索引擎 =====
            initCustomSearch();
          });

          hook.doneEach(function () {
            // 延迟重试，确保 sidebar 完全渲染
            setTimeout(setupCollapsibleSidebar, 200);
            setTimeout(setupCollapsibleSidebar, 600);
          });
        },
        // ===== GitHub 文件浏览插件（支持嵌套文件夹） =====
        function (hook, vm) {
          var API_BASE = 'https://api.github.com/repos/Iroul1212/XJTU_EE-study-material/contents/';
          var RAW_BASE = 'https://raw.githubusercontent.com/Iroul1212/XJTU_EE-study-material/main/';
          var CACHE_KEY = 'xjtu-file-cache';
          var CACHE_TTL = 30 * 60 * 1000; // 30 分钟缓存

          // 文件图标映射
          function getFileIcon(name) {
            var ext = name.split('.').pop().toLowerCase();
            var map = {
              pdf: '📄', doc: '📝', docx: '📝', ppt: '📊', pptx: '📊',
              xls: '📈', xlsx: '📈', zip: '📦', rar: '📦', '7z': '📦',
              jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', svg: '🖼️',
              md: '📋', txt: '📃', py: '🐍', c: '⚙️', cpp: '⚙️',
              java: '☕', js: '📜', html: '🌐', css: '🎨'
            };
            return map[ext] || '📁';
          }

          function formatSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
          }

          function getCache() {
            try {
              var raw = sessionStorage.getItem(CACHE_KEY);
              if (!raw) return {};
              var cache = JSON.parse(raw);
              var now = Date.now();
              Object.keys(cache).forEach(function (k) {
                if (now - cache[k]._ts > CACHE_TTL) delete cache[k];
              });
              return cache;
            } catch (e) { return {}; }
          }

          function setCache(key, data) {
            try {
              var cache = getCache();
              cache[key] = { data: data, _ts: Date.now() };
              sessionStorage.setItem(CACHE_KEY, JSON.stringify(cache));
            } catch (e) { /* storage full, ignore */ }
          }

          // 构建面包屑
          function buildBreadcrumb(fullPath) {
            var parts = fullPath.split('/').filter(Boolean);
            if (parts.length <= 1) return '';
            var html = '<div class="file-breadcrumb">';
            html += '<a class="breadcrumb-back" href="#/../' + parts[0] + '/">📂 ' + parts[0] + '</a>';
            for (var i = 1; i < parts.length; i++) {
              var p = parts.slice(0, i + 1).join('/');
              html += '<span class="breadcrumb-sep"> / </span>';
              if (i === parts.length - 1) {
                html += '<span class="breadcrumb-current">' + parts[i] + '</span>';
              } else {
                html += '<a href="#/../' + p + '/">' + parts[i] + '</a>';
              }
            }
            html += '</div>';
            return html;
          }

          // 构建文件/文件夹列表 HTML
          function buildFileListHTML(items, fullPath) {
            var courseRoot = fullPath.split('/')[0]; // 课程根目录名
            var files = items.filter(function (f) { return f.type === 'file'; });
            var folders = items.filter(function (f) { return f.type === 'dir'; });

            if (items.length === 0) {
              return '<div class="file-list-empty"><div class="empty-icon">📭</div><p>该目录暂无资料</p><p style="font-size:12px;margin-top:8px;">欢迎通过 GitHub PR 贡献资料 🎉</p></div>';
            }

            var html = '';

            // 文件夹列表
            if (folders.length > 0) {
              html += '<div class="file-section-label">📁 文件夹</div>';
              html += '<div class="file-list">';
              folders.forEach(function (f) {
                var subPath = fullPath + '/' + encodeURIComponent(f.name);
                html += '<a class="file-card folder-card" href="#/../' + subPath + '/">';
                html += '<span class="file-icon">📂</span>';
                html += '<div class="file-info">';
                html += '<div class="file-name">' + f.name + '</div>';
                html += '<div class="file-meta">文件夹</div>';
                html += '</div>';
                html += '<span class="file-enter">→</span>';
                html += '</a>';
              });
              html += '</div>';
            }

            // 文件列表
            if (files.length > 0) {
              if (folders.length > 0) html += '<div class="file-section-label">📄 文件</div>';
              html += '<div class="file-list">';
              files.forEach(function (f) {
                var icon = getFileIcon(f.name);
                var dlUrl = RAW_BASE + encodeURI(fullPath) + '/' + encodeURIComponent(f.name);
                html += '<div class="file-card">';
                html += '<span class="file-icon">' + icon + '</span>';
                html += '<div class="file-info">';
                html += '<div class="file-name">' + f.name + '</div>';
                html += '<div class="file-meta">' + formatSize(f.size) + '</div>';
                html += '</div>';
                html += '<a class="file-download" href="' + dlUrl + '" onclick="downloadFile(event, \'' + dlUrl + '\', \'' + f.name.replace(/'/g, "\\'") + '\')" target="_blank" rel="noopener">⬇ 下载</a>';
                html += '</div>';
              });
              html += '</div>';
            }

            return html;
          }

          // ===== 跨域文件下载（支持代码/图片等所有类型） =====
          window.downloadFile = function (event, url, filename) {
            event.preventDefault();
            var downloadBtn = event.target;
            var originalText = downloadBtn.textContent;
            downloadBtn.textContent = '⏳ 下载中...';
            downloadBtn.style.pointerEvents = 'none';
            downloadBtn.style.opacity = '0.6';

            fetch(url, { mode: 'cors' })
              .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.blob();
              })
              .then(function (blob) {
                var blobUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                downloadBtn.textContent = originalText;
                downloadBtn.style.pointerEvents = '';
                downloadBtn.style.opacity = '';
              })
              .catch(function (err) {
                // 如果 fetch 失败（如 CORS 限制），回退到直接打开链接
                downloadBtn.textContent = originalText;
                downloadBtn.style.pointerEvents = '';
                downloadBtn.style.opacity = '';
                window.open(url, '_blank');
              });
          };

          // ===== GitHub 文件浏览 =====
          function handleFileBrowse() {
            var hash = window.location.hash;
            // CMS 后台需要以独立页面打开，不能嵌在 Docsify SPA 中
            if (hash === '#/admin/' || hash === '#/admin') {
              window.location.href = '/admin/';
              return;
            }
            // 匹配: #/../课程名/ 或 #/../课程名/子目录/... 
            var match = hash.match(/^#\/\.\.\/(.+?)\/?$/);
            if (!match) return;

            var fullPath = decodeURIComponent(match[1]);
            // 去掉末尾 /
            fullPath = fullPath.replace(/\/$/, '');

            // 延迟执行，等 docsify 渲染完后再替换
            setTimeout(function () {
              var contentEl = document.querySelector('.markdown-section');
              if (!contentEl) return;

              contentEl.innerHTML = '<div class="file-list-loading"><p style="font-size:18px;">⏳</p><p>正在加载文件列表...</p></div>';

              var cache = getCache();
              if (cache[fullPath]) {
                var title = '<h1>📂 ' + fullPath.split('/').pop() + '</h1>';
                contentEl.innerHTML = title + buildBreadcrumb(fullPath) + buildFileListHTML(cache[fullPath].data, fullPath);
                return;
              }

              var apiUrl = API_BASE + encodeURI(fullPath);
              fetch(apiUrl)
                .then(function (res) {
                  if (!res.ok) throw new Error('HTTP ' + res.status);
                  return res.json();
                })
                .then(function (data) {
                  var items = Array.isArray(data) ? data : [];
                  setCache(fullPath, items);
                  var el = document.querySelector('.markdown-section');
                  if (el) {
                    var title = '<h1>📂 ' + fullPath.split('/').pop() + '</h1>';
                    el.innerHTML = title + buildBreadcrumb(fullPath) + buildFileListHTML(items, fullPath);
                  }
                })
                .catch(function (err) {
                  var el = document.querySelector('.markdown-section');
                  if (el) el.innerHTML = '<h1>📂 ' + fullPath.split('/').pop() + '</h1><div class="file-list-error"><p>⚠️ 加载失败：' + err.message + '</p><p style="font-size:12px;margin-top:8px;">请检查网络连接后刷新重试</p></div>';
                });
            }, 300);
          }

          // 监听 hash 变化 + 初始加载
          window.addEventListener('hashchange', handleFileBrowse);
          hook.doneEach(function () {
            setTimeout(handleFileBrowse, 100);
          });
        }
      ]
    };

    // ===== 暗黑模式切换逻辑 =====
    (function () {
      var DARK_KEY = 'xjtu-ee-dark-mode';
      var toggle = document.getElementById('darkModeToggle');
      var html = document.documentElement;

      // 读取保存的偏好（默认跟随系统）
      function getPref() {
        var saved = localStorage.getItem(DARK_KEY);
        if (saved === 'dark') return true;
        if (saved === 'light') return false;
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      function applyDark(isDark) {
        if (isDark) {
          html.classList.add('dark');
          toggle.textContent = '☀️';
        } else {
          html.classList.remove('dark');
          toggle.textContent = '🌙';
        }
      }

      var isDark = getPref();
      applyDark(isDark);

      toggle.addEventListener('click', function () {
        isDark = !isDark;
        applyDark(isDark);
        localStorage.setItem(DARK_KEY, isDark ? 'dark' : 'light');
      });

      // 监听系统主题变化（当用户未手动设置时跟随）
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (localStorage.getItem(DARK_KEY) === null) {
          isDark = e.matches;
          applyDark(isDark);
        }
      });
    })();
  </script>
