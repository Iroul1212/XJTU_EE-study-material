<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理 - XJTU 南洋学辅学习资料站</title>
  <link href="https://unpkg.com/decap-cms@3.6.1/dist/decap-cms.css" rel="stylesheet" />
  <style>
    /* ===== 自定义 CMS 样式 ===== */
    [class*="BackCollection"] button, [class*="AddButton"] button {
      background-color: #4a8cd9 !important;
    }
    [class*="PreviewPaneContainer"] {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    /* ===== 登录页居中 ===== */
    [class*="AuthenticationPage"] {
      justify-content: center !important;
    }
    [class*="AuthForm"] {
      text-align: center !important;
    }
    [class*="AuthForm"] input {
      text-align: center !important;
    }
    /* 登录按钮居中 */
    [class*="LoginButton"] {
      margin: 0 auto !important;
      display: block !important;
    }

    /* ===== 注册链接 ===== */
    .custom-signup-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #4a8cd9;
      text-decoration: none;
    }
    .custom-signup-link:hover {
      text-decoration: underline;
    }

    /* ===== 返回首页链接 ===== */
    .custom-home-link {
      position: fixed;
      top: 20px;
      left: 24px;
      font-size: 14px;
      color: #4a8cd9;
      text-decoration: none;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .custom-home-link:hover {
      text-decoration: underline;
    }
    .dark-mode .custom-home-link {
      color: #7eb8ff;
    }

    /* ===== 暗黑模式切换按钮 ===== */
    .dark-toggle {
      position: fixed;
      top: 18px;
      right: 24px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      font-size: 18px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }
    .dark-mode .dark-toggle {
      background: #2d2d2d;
      border-color: #555;
    }

    /* ===== 暗黑模式 - 登录页 ===== */
    .dark-mode [class*="AuthenticationPage"] {
      background: #1a1a2e !important;
    }
    .dark-mode [class*="AuthForm"] input {
      background: #2d2d3f !important;
      color: #eee !important;
      border-color: #444 !important;
    }
    .dark-mode [class*="AuthForm"] input::placeholder {
      color: #888 !important;
    }
    .dark-mode [class*="LoginButton"] {
      background: #4a8cd9 !important;
    }
    .dark-mode [class*="GoBackButtonStyle"] {
      color: #aaa !important;
    }

    /* ===== 暗黑模式 - CMS 后台 ===== */
    .dark-mode [class*="AppHeader"] {
      background: #1e1e2e !important;
    }
    .dark-mode [class*="SidebarContainer"],
    .dark-mode [class*="Editor"] {
      background: #1a1a2e !important;
      color: #ddd !important;
    }
    .dark-mode [class*="Card"] {
      background: #2d2d3f !important;
      color: #ddd !important;
      border-color: #444 !important;
    }

    /* 过渡动画 */
    [class*="AuthenticationPage"],
    [class*="AuthForm"] input,
    [class*="AppHeader"],
    [class*="SidebarContainer"],
    [class*="Card"] {
      transition: background 0.3s, color 0.3s, border-color 0.3s !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.6.1/dist/decap-cms.js"></script>
  <script>
    // ===== 暗黑模式 =====
    (function() {
      const saved = localStorage.getItem('cms-dark-mode');
      if (saved === 'true') document.body.classList.add('dark-mode');

      const toggle = document.createElement('button');
      toggle.className = 'dark-toggle';
      toggle.title = '切换暗黑模式';
      toggle.textContent = saved === 'true' ? '☀️' : '🌙';
      toggle.onclick = function() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem('cms-dark-mode', isDark);
        toggle.textContent = isDark ? '☀️' : '🌙';
      };
      document.body.appendChild(toggle);
    })();

    // ===== 返回首页按钮 =====
    (function() {
      const homeLink = document.createElement('a');
      homeLink.href = 'https://celadon-malasada-e61291.netlify.app';
      homeLink.className = 'custom-home-link';
      homeLink.innerHTML = '← 返回首页';
      document.body.appendChild(homeLink);
    })();

    // ===== 在登录按钮旁注入"注册"链接 =====
    const observer = new MutationObserver(() => {
      if (document.querySelector('.custom-signup-link')) return;
      const loginBtn = document.querySelector('[class*="LoginButton"]');
      if (loginBtn) {
        const link = document.createElement('a');
        link.href = '/admin/signup.html';
        link.className = 'custom-signup-link';
        link.textContent = '没有账号？注册';
        loginBtn.insertAdjacentElement('afterend', link);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
