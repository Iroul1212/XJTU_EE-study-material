<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理 - XJTU 南洋学辅学习资料站</title>
  <link href="https://unpkg.com/decap-cms@3.6.1/dist/decap-cms.css" rel="stylesheet" />
  <style>
    :root { --ink:#16302d; --muted:#667773; --line:#dce7e3; --paper:#f5f8f6; --panel:#fff; --brand:#0d6b61; --brand-deep:#084940; --warm:#ef9b49; }
    * { box-sizing:border-box; }
    body { background:var(--paper)!important; color:var(--ink); font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif!important; }
    .cms-brand { position:fixed; top:12px; left:20px; z-index:1001; display:flex; align-items:center; gap:9px; color:#fff; font-size:14px; font-weight:800; pointer-events:none; }
    .cms-brand-mark { display:grid; place-items:center; width:27px; height:27px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12); color:#ffe0a3; font-size:11px; }
    .custom-home-link { position:fixed; z-index:1002; right:76px; top:13px; padding:7px 10px; color:#d9eee8; text-decoration:none; border:1px solid rgba(255,255,255,.25); border-radius:4px; font-size:13px; font-weight:700; }
    .custom-home-link:hover { background:rgba(255,255,255,.12); color:#fff; }
    .dark-toggle { position:fixed; z-index:1002; top:13px; right:22px; display:grid; place-items:center; width:34px; height:34px; padding:0; border:1px solid rgba(255,255,255,.25); border-radius:4px; background:transparent; color:#fff; cursor:pointer; font-size:16px; }
    .dark-toggle:hover { background:rgba(255,255,255,.12); }
    [class*="AppHeader"] { min-height:56px!important; padding-left:184px!important; background:var(--brand-deep)!important; box-shadow:none!important; }
    [class*="AppHeader"] a, [class*="AppHeader"] button { color:#e3f1ed!important; }
    [class*="SidebarContainer"] { background:#fbfcfb!important; border-right:1px solid var(--line)!important; }
    [class*="SidebarContainer"] a { color:#526660!important; font-weight:600!important; }
    [class*="SidebarContainer"] a:hover, [class*="SidebarContainer"] [class*="Active"] { color:var(--brand-deep)!important; background:#e6f2ee!important; }
    [class*="Editor"], [class*="CollectionMain"], [class*="PreviewPaneContainer"] { background:var(--paper)!important; }
    [class*="Editor"] > div, [class*="CollectionMain"] > div { border-radius:0!important; }
    [class*="Card"], [class*="Collection"], [class*="EntryListing"], [class*="EditorControl"] { border-color:var(--line)!important; box-shadow:none!important; }
    [class*="Card"], [class*="Collection"], [class*="EntryListing"] { border-radius:6px!important; background:var(--panel)!important; }
    [class*="Card"]:hover { border-color:#8ebcaf!important; box-shadow:0 8px 20px rgba(20,61,52,.08)!important; }
    [class*="FieldLabel"] { color:var(--ink)!important; font-size:14px!important; font-weight:800!important; }
    [class*="FieldHint"] { color:var(--muted)!important; font-size:12px!important; }
    input, textarea, select, [contenteditable="true"] { border-color:#c9dad5!important; border-radius:4px!important; box-shadow:none!important; color:var(--ink)!important; }
    input:focus, textarea:focus, select:focus, [contenteditable="true"]:focus { border-color:var(--brand)!important; box-shadow:0 0 0 3px rgba(13,107,97,.12)!important; outline:none!important; }
    [class*="Toolbar"] { border-color:var(--line)!important; background:#f9fbfa!important; }
    [class*="Toolbar"] button:hover { background:#e6f2ee!important; color:var(--brand-deep)!important; }
    [class*="Upload"] { border:1px dashed #9ebeb5!important; border-radius:5px!important; background:#f7fbf9!important; }
    [class*="Upload"]:hover { border-color:var(--brand)!important; background:#edf7f3!important; }
    [class*="BackCollection"] button, [class*="AddButton"] button, [class*="PublishButton"] button, [class*="SaveButton"] button { border-radius:4px!important; background:var(--brand)!important; color:#fff!important; box-shadow:none!important; font-weight:800!important; }
    [class*="BackCollection"] button:hover, [class*="AddButton"] button:hover, [class*="PublishButton"] button:hover, [class*="SaveButton"] button:hover { background:var(--brand-deep)!important; }
    [class*="DeleteButton"] button { border-radius:4px!important; }
    [class*="AuthenticationPage"] { justify-content:center!important; background:var(--paper)!important; }
    [class*="AuthForm"] { width:min(410px,calc(100vw - 36px))!important; padding:38px 34px!important; text-align:center!important; border:1px solid var(--line)!important; border-top:4px solid var(--warm)!important; border-radius:6px!important; background:var(--panel)!important; box-shadow:0 18px 38px rgba(19,55,47,.1)!important; }
    [class*="AuthForm"] input { text-align:center!important; }
    [class*="LoginButton"], [class*="GitHubButton"] { margin:0 auto!important; border-radius:4px!important; background:var(--brand)!important; box-shadow:none!important; font-weight:800!important; }
    .custom-signup-link { display:block; margin-top:15px; color:var(--brand)!important; font-size:13px; font-weight:700; text-decoration:none; }.custom-signup-link:hover { text-decoration:underline; }
    html.dark { --ink:#e3eee9; --muted:#a7bbb4; --line:#355149; --paper:#14211e; --panel:#1b2b27; --brand:#71c3b1; --brand-deep:#0d4038; }
    .dark-mode [class*="SidebarContainer"] { background:#10201c!important; }.dark-mode [class*="AppHeader"] { background:#092f2a!important; }.dark-mode [class*="SidebarContainer"] a { color:#b7c9c3!important; }.dark-mode [class*="SidebarContainer"] a:hover { background:#1d3b34!important; color:#8dd3c4!important; }.dark-mode [class*="Card"],.dark-mode [class*="Collection"],.dark-mode [class*="EntryListing"],.dark-mode [class*="AuthForm"] { background:var(--panel)!important; color:var(--ink)!important; }.dark-mode input,.dark-mode textarea,.dark-mode select,.dark-mode [contenteditable="true"] { background:#152722!important; color:var(--ink)!important; border-color:var(--line)!important; }.dark-mode [class*="Toolbar"] { background:#1c302a!important; }.dark-mode [class*="Upload"] { background:#172a25!important; }.dark-mode [class*="Editor"],.dark-mode [class*="CollectionMain"],.dark-mode [class*="PreviewPaneContainer"],.dark-mode [class*="AuthenticationPage"] { background:var(--paper)!important; color:var(--ink)!important; }
    @media (max-width:700px) { .cms-brand { left:56px; }.cms-brand span:last-child { display:none; }.custom-home-link { right:64px; font-size:0; border:0; }.custom-home-link::after { content:"首页"; font-size:13px; }.dark-toggle { right:14px; }.custom-home-link { right:55px; } [class*="AppHeader"] { padding-left:105px!important; } [class*="AuthForm"] { padding:30px 22px!important; } }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.6.1/dist/decap-cms.js"></script>
  <script>
    // ===== 暗黑模式 =====
    (function() {
      const saved = localStorage.getItem('cms-dark-mode');
      if (saved === 'true') document.body.classList.add('dark-mode');

      const toggle = document.createElement('button');
      toggle.className = 'dark-toggle';
      toggle.title = '切换暗黑模式';
      toggle.textContent = saved === 'true' ? '☀️' : '🌙';
      toggle.onclick = function() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem('cms-dark-mode', isDark);
        toggle.textContent = isDark ? '☀️' : '🌙';
      };
      document.body.appendChild(toggle);
    })();

    // ===== 返回首页按钮 =====
    (function() {
      const homeLink = document.createElement('a');
      homeLink.href = '/';
      homeLink.className = 'custom-home-link';
      homeLink.innerHTML = '← 返回首页';
      document.body.appendChild(homeLink);
    })();

    (function() {
      const brand = document.createElement('div');
      brand.className = 'cms-brand';
      brand.innerHTML = '<span class="cms-brand-mark">EE</span><span>南洋学辅 <small>/ 内容管理</small></span>';
      document.body.appendChild(brand);
    })();

    // ===== 在登录按钮旁注入"注册"链接 =====
    const observer = new MutationObserver(() => {
      if (document.querySelector('.custom-signup-link')) return;
      const loginBtn = document.querySelector('[class*="LoginButton"], [class*="GitHubButton"]');
      if (loginBtn) {
        const link = document.createElement('a');
        link.href = 'https://github.com/signup';
        link.target = '_blank';
        link.className = 'custom-signup-link';
        link.textContent = '没有 GitHub 账号？免费注册';
        loginBtn.insertAdjacentElement('afterend', link);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
