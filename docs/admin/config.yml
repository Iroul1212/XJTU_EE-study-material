backend:
  name: github
  repo: Iroul1212/XJTU_EE-study-material
  branch: main
  base_url: https://xjtu-nyxf-study-material.vercel.app
  auth_endpoint: api/auth
  
# 媒体文件存储位置
media_folder: "docs/assets/uploads"
public_folder: "/assets/uploads"

# 站点 URL
site_url: https://iroul1212.github.io/XJTU_EE-study-material
display_url: https://iroul1212.github.io/XJTU_EE-study-material

# 语言
locale: "zh_Hans"

# Logo
logo_url: https://iroul1212.github.io/XJTU_EE-study-material/logo.png

# 编辑器配置
# publish_mode: editorial_workflow

# ========== 内容集合定义 ==========
collections:
  # 首页 README
  - name: "home"
    label: "🏠 首页内容"
    label_singular: "首页"
    description: "编辑网站首页展示内容"
    files:
      - file: "docs/README.md"
        label: "首页"
        name: "home"
        fields:
          - { label: "页面标题", name: "title", widget: "string", required: false }
          - { label: "正文内容", name: "body", widget: "markdown" }

  # 课程资料条目（网站索引页）
  - name: "courses"
    label: "📚 课程资料"
    label_singular: "课程"
    description: "管理各门课程的网站索引页面"
    folder: "docs/courses"
    create: true
    slug: "{{slug}}"
    preview_path: "courses/{{slug}}"
    fields:
      - { label: "课程名称", name: "title", widget: "string" }
      - { label: "课程分类", name: "category", widget: "select", options: ["公共课程", "电气专业", "电子专业", "微电子专业"] }
      - { label: "子分类", name: "subcategory", widget: "select", options: ["思政类", "数学类", "物理与化学", "其他公共课", "专业核心课", "实验与实践"], required: false }
      - label: "课程图标"
        name: "icon"
        widget: "select"
        default: "📖"
        required: false
        options:
          - { label: "📖 书本", value: "📖" }
          - { label: "📘 蓝书", value: "📘" }
          - { label: "📙 橙书", value: "📙" }
          - { label: "📕 红书", value: "📕" }
          - { label: "📗 绿书", value: "📗" }
          - { label: "📓 笔记本", value: "📓" }
          - { label: "📝 备忘录", value: "📝" }
          - { label: "📐 三角尺", value: "📐" }
          - { label: "📏 直尺", value: "📏" }
          - { label: "🔬 显微镜", value: "🔬" }
          - { label: "🔭 望远镜", value: "🔭" }
          - { label: "⚡ 闪电", value: "⚡" }
          - { label: "💡 灯泡", value: "💡" }
          - { label: "🔋 电池", value: "🔋" }
          - { label: "🧲 磁铁", value: "🧲" }
          - { label: "🧮 算盘", value: "🧮" }
          - { label: "📊 图表", value: "📊" }
          - { label: "📈 上升", value: "📈" }
          - { label: "🧪 试管", value: "🧪" }
          - { label: "⚛️ 原子", value: "⚛️" }
          - { label: "💻 电脑", value: "💻" }
          - { label: "🖥️ 显示器", value: "🖥️" }
          - { label: "🔧 扳手", value: "🔧" }
          - { label: "🛠️ 工具", value: "🛠️" }
          - { label: "🎓 学士帽", value: "🎓" }
          - { label: "🏫 学校", value: "🏫" }
          - { label: "✏️ 铅笔", value: "✏️" }
          - { label: "📋 剪贴板", value: "📋" }
          - { label: "📌 图钉", value: "📌" }
          - { label: "⭐ 星标", value: "⭐" }
      - { label: "内容", name: "body", widget: "markdown", required: false }

  # 课程文件夹（创建后 GitHub Action 自动生成根目录文件夹）
  - name: "course_folders"
    label: "📁 新建课程"
    label_singular: "课程"
    description: "创建新课程。保存后自动在仓库根目录生成同名文件夹用于存放资料。"
    folder: "course-data"
    create: true
    slug: "{{slug}}"
    summary: "📁 {{title}}"
    fields:
      - { label: "课程名称", name: "title", widget: "string", hint: "例如：嵌入式系统，保存后自动创建根目录文件夹" }
      - { label: "课程分类", name: "category", widget: "select", options: ["公共课程", "电气专业", "电子专业", "微电子专业"], required: false }
      - { label: "课程简介", name: "body", widget: "markdown", required: false }

  # 上传资料文件（通过 GitHub Action 自动归入课程文件夹）
  - name: "file_uploads"
    label: "📤 上传资料"
    label_singular: "资料"
    description: "上传课程资料（PDF、图片等）。选择目标课程后上传，系统自动归档到对应课程文件夹。"
    folder: "docs/file-queue"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{slug}}"
    summary: "📄 {{course}} / {{title}}"
    fields:
      - label: "目标课程"
        name: "course"
        widget: "select"
        options:
          - "习思想"
          - "军理（国防教育）"
          - "史纲"
          - "思修"
          - "马原"
          - "毛概"
          - "高数&CMC"
          - "线代"
          - "概率论"
          - "复变"
          - "数学物理方程"
          - "大学物理"
          - "大物实验"
          - "大学化学"
          - "大化实验"
          - "工程制图"
          - "大计基"
          - "电路"
          - "电路实验"
          - "电磁场"
          - "电磁场和信号与系统实验"
          - "模拟电子技术"
          - "数电"
          - "模电数电实验"
          - "信号与系统"
          - "南洋独家资料"
      - { label: "资料名称", name: "title", widget: "string" }
      - { label: "资料文件", name: "file", widget: "file" }

  # 公告与更新日志
  - name: "news"
    label: "📢 公告与更新"
    label_singular: "公告"
    folder: "docs/news"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "内容", name: "body", widget: "markdown" }
