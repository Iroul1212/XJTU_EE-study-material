# Netlify 部署配置（放在 docs/ 下）
# CMS 网页上传 —— 访问 /admin/ 用 GitHub 账号登录即可上传文件

[build]
  publish = "."
  command = "echo 'No build step'"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
