# Netlify 部署配置（放在 docs/ 下）
# CMS 网页上传 —— 访问 /admin/ 用 GitHub 账号登录即可上传文件

[build]
  publish = "."
  command = "echo 'Sidebar auto-generated by GitHub Actions'"

# ⚠️ 重定向按顺序匹配，config.yml 必须放在通配规则前面！

[[redirects]]
  from = "/admin/config.yml"
  to = "/admin/config.yml"
  status = 200

[[redirects]]
  from = "/admin/signup.html"
  to = "/admin/signup.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
